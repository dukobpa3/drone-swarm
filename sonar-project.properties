# SonarQube analysis of the whole monorepo, run with `make sonar`. Host and
# token come from SONAR_HOST_URL and SONAR_TOKEN (.env), never from this file.
# Add each new service's code directories to sources and tests.
sonar.projectKey=drone-swarm
sonar.projectName=drone-swarm
sonar.sourceEncoding=UTF-8

sonar.sources=sim/cmd,sim/internal
sonar.exclusions=**/*_test.go
sonar.tests=sim/cmd,sim/internal
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=sim/coverage.out

sonar.go.golangci-lint.reportPaths=sim/golangci-lint.xml
